services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qinzi
      POSTGRES_PASSWORD: qinzi123
      POSTGRES_DB: qinzi_paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qinzi -d qinzi_paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5433:5432"
    volumes:
      - qinzi-pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3200:3100"
    environment:
      DATABASE_URL: postgres://qinzi:qinzi123@db:5432/qinzi_paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3200}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - qinzi-paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  qinzi-pgdata:
  qinzi-paperclip-data:
